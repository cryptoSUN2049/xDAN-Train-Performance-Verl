# Group A formal run (Code + Harbor rows in one dataset) x DSH on Modal.
# Task images are the public per-task images; DshSdkAgent injects the task-independent /opt/dsh payload
# at run time (option B) and the bootstrap re-verifies runtime identities in the sandbox. The environment
# block matches mini-mimocode-modal.yaml so the two harnesses see identical task containers.
use_dataset_env: true

agent:
  type: dsh-sdk
  python_path: /opt/dsh/bin/python
  payload_path: /workspace/xdan-verl-fusion/payloads/dsh-runtime-0.1.3a2-linux-x86_64.tar.gz
  payload_sha256: e118df1d7c17eddde236b0a94b5e649e070cc18c7e7c6bfe6d6dcca98c9e275f
  run_timeout: 3600
  max_tokens: 4096
  context_window: 65536
  profile: sdk-minimal

environment:
  environment_class: modal
  cwd: /testbed
  timeout: 900
  sandbox_timeout: 7200
  cpu: 2
  memory: 8192
  anti_hack_cleanup: true
  raise_on_transport_error: true

model:
  model_name: policy
  protocol: chat
  model_kwargs:
    max_tokens: 4096
    timeout: 3600
    max_retries: 0
    temperature: 1.0
